name: Check evaluation website
on:
  pull_request:
    paths: ['website/**', 'docs/**', 'PROMPT/**', 'Test_Results/**', 'AGENTS.md', 'README.md', '.github/workflows/website-*.yml']
  push:
    branches-ignore: [main]
    paths: ['website/**', 'docs/**', 'PROMPT/**', 'Test_Results/**', 'AGENTS.md', 'README.md', '.github/workflows/website-*.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      # 完整历史：verify-source-links 需要按提交校验源码链接（浅克隆会让每个历史提交都查不到）。
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run import:data && npm run validate:data
      - run: npm run check
      - run: npm test
      - run: npm run build
      # 浏览器流程纳入 CI：装三套浏览器后跑 e2e（需完整历史，见上面的 checkout 配置）。
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
