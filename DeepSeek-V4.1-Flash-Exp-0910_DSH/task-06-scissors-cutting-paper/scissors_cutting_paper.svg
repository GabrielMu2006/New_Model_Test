<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9f9f9"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Table Background -->
  <rect width="100%" height="100%" fill="#f5f0e8"/>
  <rect width="100%" height="100%" fill="url(#vignette)"/>

  <!-- Scene Group with slight rotation -->
  <g transform="rotate(-8, 400, 300)">
    <!-- Paper Shadow -->
    <rect x="205" y="205" width="390" height="290" fill="#000" fill-opacity="0.08" rx="4"/>

    <!-- Paper -->
    <rect x="200" y="200" width="390" height="290" fill="url(#paperGrad)" stroke="#e0e0e0" stroke-width="2" rx="4"/>

    <!-- Text Lines -->
    <g stroke="#e0e0e0" stroke-width="2" stroke-linecap="round">
      <line x1="240" y1="250" x2="550" y2="250"/>
      <line x1="240" y1="280" x2="500" y2="280"/>
      <line x1="240" y1="310" x2="530" y2="310"/>
      <line x1="240" y1="340" x2="480" y2="340"/>
      <line x1="240" y1="370" x2="520" y2="370"/>
      <line x1="240" y1="400" x2="450" y2="400"/>
      <line x1="240" y1="430" x2="500" y2="430"/>
    </g>

    <!-- Cut Line -->
    <!-- Already cut part -->
    <line x1="250" y1="450" x2="400" y2="305" stroke="#bbb" stroke-width="3"/>
    <!-- Cut edge highlight -->
    <line x1="251" y1="449" x2="401" y2="304" stroke="#fff" stroke-width="1"/>
    <!-- Remaining cut (dashed) -->
    <line x1="400" y1="305" x2="550" y2="160" stroke="#999" stroke-width="2" stroke-dasharray="6, 4"/>

    <!-- Scissors Shadow -->
    <polygon points="410,320 260,465 275,475 420,340" fill="#000" fill-opacity="0.1"/>

    <!-- Scissors Lower Blade -->
    <polygon points="400,315 270,470 285,480 410,335" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>

    <!-- Scissors Upper Blade -->
    <polygon points="400,305 250,450 265,460 410,325" fill="#bdc3c7" stroke="#95a5a6" stroke-width="2"/>

    <!-- Scissors Pivot -->
    <circle cx="405" cy="320" r="6" fill="#555" stroke="#333" stroke-width="2"/>
    <circle cx="403" cy="318" r="2" fill="#fff" opacity="0.5"/>

    <!-- Scissors Handles -->
    <path d="M 400 305 Q 480 250 520 200 Q 540 220 460 275 Z" fill="none" stroke="#2c3e50" stroke-width="12" stroke-linecap="round"/>
    <path d="M 400 315 Q 480 280 540 220 Q 560 240 480 300 Z" fill="none" stroke="#2c3e50" stroke-width="12" stroke-linecap="round"/>

    <!-- Hand Shadow -->
    <ellipse cx="590" cy="230" rx="50" ry="35" transform="rotate(-35, 590, 230)" fill="#000" fill-opacity="0.1"/>

    <!-- Hand Wrist -->
    <path d="M 620 190 L 680 140" stroke="#f0b27a" stroke-width="35" stroke-linecap="round"/>

    <!-- Hand Fingers -->
    <!-- Thumb -->
    <line x1="580" y1="200" x2="500" y2="210" stroke="#f0b27a" stroke-width="20" stroke-linecap="round"/>
    <!-- Index -->
    <line x1="580" y1="210" x2="520" y2="240" stroke="#f0b27a" stroke-width="16" stroke-linecap="round"/>
    <!-- Middle -->
    <line x1="590" y1="220" x2="530" y2="250" stroke="#f0b27a" stroke-width="16" stroke-linecap="round"/>
    <!-- Ring -->
    <line x1="600" y1="230" x2="540" y2="260" stroke="#f0b27a" stroke-width="16" stroke-linecap="round"/>
    <!-- Pinky -->
    <line x1="610" y1="240" x2="550" y2="270" stroke="#f0b27a" stroke-width="16" stroke-linecap="round"/>

    <!-- Hand Palm -->
    <ellipse cx="590" cy="215" rx="45" ry="35" transform="rotate(-35, 590, 215)" fill="#f0b27a" stroke="#d35400" stroke-width="2"/>

    <!-- Fingernails -->
    <ellipse cx="505" cy="208" rx="6" ry="4" fill="#fff" transform="rotate(-10, 505, 208)"/>
    <ellipse cx="525" cy="238" rx="5" ry="3.5" fill="#fff" transform="rotate(-40, 525, 238)"/>
    <ellipse cx="535" cy="248" rx="5" ry="3.5" fill="#fff" transform="rotate(-40, 535, 248)"/>
    <ellipse cx="545" cy="258" rx="5" ry="3.5" fill="#fff" transform="rotate(-40, 545, 258)"/>
    <ellipse cx="555" cy="268" rx="5" ry="3.5" fill="#fff" transform="rotate(-40, 555, 268)"/>

    <!-- Ring on Ring Finger -->
    <ellipse cx="540" cy="260" rx="6" ry="3" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1" transform="rotate(-40, 540, 260)"/>
  </g>
</svg>
