    <line x1="236.177" y1="370.198" x2="234.929" y2="364.329" />
    <line x1="218.188" y1="373.047" x2="217.561" y2="367.08" />
    <line x1="181.812" y1="373.047" x2="182.439" y2="367.08" />
    <line x1="163.823" y1="370.198" x2="165.071" y2="364.329" />
    <line x1="146.231" y1="365.484" x2="148.085" y2="359.777" />
    <line x1="129.228" y1="358.957" x2="131.668" y2="353.476" />
    <line x1="97.725" y1="340.769" x2="101.252" y2="335.915" />
    <line x1="83.571" y1="329.307" x2="87.586" y2="324.848" />
    <line x1="70.693" y1="316.429" x2="75.152" y2="312.414" />
    <line x1="59.231" y1="302.275" x2="64.085" y2="298.748" />
