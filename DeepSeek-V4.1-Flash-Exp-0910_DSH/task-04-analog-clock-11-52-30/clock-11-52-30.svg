  <!-- hour markers -->
  <g class="hour">
    <line x1="200" y1="26" x2="200" y2="48" />
    <line x1="287" y1="49.312" x2="276" y2="68.364" />
    <line x1="350.688" y1="113" x2="331.636" y2="124" />
    <line x1="374" y1="200" x2="352" y2="200" />
