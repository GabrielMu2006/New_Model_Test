  <!-- numerals -->
  <g class="num">
    <text x="264" y="89.149">1</text>
    <text x="310.851" y="136">2</text>
    <text x="328" y="200">3</text>
    <text x="310.851" y="264">4</text>
    <text x="264" y="310.851">5</text>
    <text x="200" y="328">6</text>
    <text x="136" y="310.851">7</text>
    <text x="89.149" y="264">8</text>
    <text x="72" y="200">9</text>
    <text x="89.149" y="136">10</text>
    <text x="136" y="89.149">11</text>
    <text x="200" y="72">12</text>
  </g>

  <!-- hands: drawn from the center outward, then rotated clockwise from 12 -->
  <!-- hour hand: 11:52:30 => 11*30 + 52.5*0.5 = 356.25 degrees -->
  <line class="hand-hour" x1="200" y1="216" x2="200" y2="104" transform="rotate(356.25 200 200)" />
  <!-- minute hand: 52 min 30 s => 52.5*6 = 315 degrees -->
  <line class="hand-minute" x1="200" y1="218" x2="200" y2="62" transform="rotate(315 200 200)" />
  <!-- second hand: 30 s => 30*6 = 180 degrees -->
  <line class="hand-second" x1="200" y1="226" x2="200" y2="48" transform="rotate(180 200 200)" />
  <circle cx="200" cy="200" r="6" fill="#dc2626" />
  <circle cx="200" cy="200" r="10" fill="none" stroke="#111827" stroke-width="4" />
</svg>
