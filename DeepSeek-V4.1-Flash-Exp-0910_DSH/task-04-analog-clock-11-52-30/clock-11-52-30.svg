<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Analog clock showing 11:52:30</title>
  <desc id="desc">A clock face with twelve hour markers. The minute hand is halfway between the 10 and 11 (52.5 minutes), the hour hand is just before the 12 (11:52:30), and the second hand points at the 6 (30 seconds).</desc>

  <defs>
    <style>
      .case  { fill: #ffffff; stroke: #1f2937; stroke-width: 8; }
      .face  { fill: #fbfaf5; stroke: #d1d5db; stroke-width: 1.5; }
      .tick  { stroke: #6b7280; stroke-width: 1.6; stroke-linecap: round; }
      .hour  { stroke: #111827; stroke-width: 9; stroke-linecap: round; }
      .num   { fill: #111827; font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .hand-hour   { stroke: #111827; stroke-width: 13; stroke-linecap: round; }
      .hand-minute { stroke: #111827; stroke-width: 8;  stroke-linecap: round; }
      .hand-second { stroke: #dc2626; stroke-width: 3;  stroke-linecap: round; }
    </style>
  </defs>

  <!-- case and face -->
  <circle class="case" cx="200" cy="200" r="180" />
  <circle class="face" cx="200" cy="200" r="166" />

  <!-- minute ticks -->
  <g class="tick">
    <line x1="218.188" y1="26.953" x2="217.561" y2="32.92" />
    <line x1="236.177" y1="29.802" x2="234.929" y2="35.671" />
    <line x1="253.769" y1="34.516" x2="251.915" y2="40.223" />
    <line x1="270.772" y1="41.043" x2="268.332" y2="46.524" />
    <line x1="302.275" y1="59.231" x2="298.748" y2="64.085" />
    <line x1="316.429" y1="70.693" x2="312.414" y2="75.152" />
    <line x1="329.307" y1="83.571" x2="324.848" y2="87.586" />
    <line x1="340.769" y1="97.725" x2="335.915" y2="101.252" />
    <line x1="358.957" y1="129.228" x2="353.476" y2="131.668" />
    <line x1="365.484" y1="146.231" x2="359.777" y2="148.085" />
    <line x1="370.198" y1="163.823" x2="364.329" y2="165.071" />
    <line x1="373.047" y1="181.812" x2="367.08" y2="182.439" />
    <line x1="373.047" y1="218.188" x2="367.08" y2="217.561" />
