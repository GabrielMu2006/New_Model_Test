<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white pelican with a long orange beak and a bulging pouch pedals a blue bicycle down a sunny country road.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfeafd"/>
      <stop offset="65%" stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#f7fbf7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d98a"/>
      <stop offset="100%" stop-color="#7dbb61"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d8d95"/>
      <stop offset="100%" stop-color="#5f6068"/>
    </linearGradient>
    <linearGradient id="bodyFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#d6dde6"/>
    </linearGradient>
    <linearGradient id="beakFill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffcf5c"/>
      <stop offset="60%" stop-color="#f9a83c"/>
      <stop offset="100%" stop-color="#e8871f"/>
    </linearGradient>
    <linearGradient id="pouchFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffb457"/>
      <stop offset="100%" stop-color="#e07a1c"/>
    </linearGradient>
    <linearGradient id="frameFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa0e0"/>
      <stop offset="100%" stop-color="#1d6fae"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7c9" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffe680" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= background ================= -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="655" cy="110" r="130" fill="url(#sunGlow)"/>
  <circle cx="655" cy="110" r="46" fill="#ffe066" stroke="#ffd23f" stroke-width="3"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="105" rx="52" ry="30"/>
      <ellipse cx="195" cy="95" rx="40" ry="26"/>
      <ellipse cx="110" cy="112" rx="34" ry="20"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="470" cy="80" rx="44" ry="24"/>
      <ellipse cx="510" cy="74" rx="32" ry="19"/>
      <ellipse cx="438" cy="86" rx="28" ry="16"/>
    </g>
  </g>

  <!-- distant hills -->
  <path d="M0 470 Q 90 392 190 452 Q 250 482 320 448 Q 400 408 470 462 Q 560 500 660 450 Q 730 414 800 466 L800 520 L0 520 Z"
        fill="#8fcb84" opacity="0.85"/>
  <path d="M0 496 Q 120 452 240 494 Q 360 534 470 496 Q 600 452 800 502 L800 540 L0 540 Z"
        fill="#7cbd6e" opacity="0.9"/>

  <!-- ground + road -->
  <rect x="0" y="500" width="800" height="100" fill="url(#ground)"/>
  <path d="M0 528 L800 528 L800 600 L0 600 Z" fill="url(#road)"/>
  <g stroke="#f2d16b" stroke-width="5" stroke-linecap="round" stroke-dasharray="42 34" opacity="0.9">
    <line x1="0" y1="572" x2="800" y2="572"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="400" cy="512" rx="235" ry="20" fill="#2f4a2a" opacity="0.18"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="60" y1="300" x2="150" y2="300"/>
    <line x1="30" y1="352" x2="118" y2="352"/>
    <line x1="86" y1="404" x2="160" y2="404"/>
  </g>

  <!-- ================= bicycle ================= -->
  <g id="bicycle">
    <!-- wheels -->
    <g id="rear-wheel">
      <circle cx="250" cy="440" r="78" fill="none" stroke="#2b2b33" stroke-width="9"/>
      <circle cx="250" cy="440" r="70" fill="none" stroke="#d9e2ea" stroke-width="4"/>
      <g stroke="#b9c6d2" stroke-width="1.6" opacity="0.95">
        <line x1="250" y1="440" x2="250" y2="372"/>
        <line x1="250" y1="440" x2="250" y2="508"/>
        <line x1="250" y1="440" x2="318" y2="440"/>
        <line x1="250" y1="440" x2="182" y2="440"/>
        <line x1="250" y1="440" x2="298" y2="392"/>
        <line x1="250" y1="440" x2="202" y2="488"/>
        <line x1="250" y1="440" x2="298" y2="488"/>
        <line x1="250" y1="440" x2="202" y2="392"/>
        <line x1="250" y1="440" x2="275" y2="375"/>
        <line x1="250" y1="440" x2="225" y2="505"/>
        <line x1="250" y1="440" x2="315" y2="415"/>
        <line x1="250" y1="440" x2="185" y2="465"/>
        <line x1="250" y1="440" x2="315" y2="465"/>
        <line x1="250" y1="440" x2="185" y2="415"/>
        <line x1="250" y1="440" x2="275" y2="505"/>
        <line x1="250" y1="440" x2="225" y2="375"/>
      </g>
      <circle cx="250" cy="440" r="7" fill="#4a5560"/>
    </g>

    <g id="front-wheel">
      <circle cx="550" cy="440" r="78" fill="none" stroke="#2b2b33" stroke-width="9"/>
      <circle cx="550" cy="440" r="70" fill="none" stroke="#d9e2ea" stroke-width="4"/>
      <g stroke="#b9c6d2" stroke-width="1.6" opacity="0.95">
        <line x1="550" y1="440" x2="550" y2="372"/>
        <line x1="550" y1="440" x2="550" y2="508"/>
        <line x1="550" y1="440" x2="618" y2="440"/>
        <line x1="550" y1="440" x2="482" y2="440"/>
        <line x1="550" y1="440" x2="598" y2="392"/>
        <line x1="550" y1="440" x2="502" y2="488"/>
        <line x1="550" y1="440" x2="598" y2="488"/>
        <line x1="550" y1="440" x2="502" y2="392"/>
        <line x1="550" y1="440" x2="575" y2="375"/>
        <line x1="550" y1="440" x2="525" y2="505"/>
        <line x1="550" y1="440" x2="615" y2="415"/>
        <line x1="550" y1="440" x2="485" y2="465"/>
        <line x1="550" y1="440" x2="615" y2="465"/>
        <line x1="550" y1="440" x2="485" y2="415"/>
        <line x1="550" y1="440" x2="575" y2="505"/>
        <line x1="550" y1="440" x2="525" y2="375"/>
      </g>
      <circle cx="550" cy="440" r="7" fill="#4a5560"/>
    </g>

    <!-- frame -->
    <g stroke="url(#frameFill)" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="250" y1="440" x2="380" y2="440"/>  <!-- chain stay -->
      <line x1="250" y1="440" x2="345" y2="318"/>  <!-- seat stay -->
      <line x1="345" y1="318" x2="380" y2="440"/>  <!-- seat tube -->
      <line x1="345" y1="318" x2="515" y2="330"/>  <!-- top tube -->
      <line x1="380" y1="440" x2="515" y2="330"/>  <!-- down tube -->
      <line x1="515" y1="330" x2="550" y2="440"/>  <!-- fork -->
    </g>

    <!-- head tube -->
    <line x1="512" y1="316" x2="522" y2="344" stroke="#1d6fae" stroke-width="14" stroke-linecap="round"/>

    <!-- handlebar -->
    <g fill="none" stroke="#3a3f47" stroke-width="9" stroke-linecap="round">
      <path d="M515 330 L516 312 Q516 300 528 298 Q548 296 552 312"/>
    </g>
    <circle cx="552" cy="313" r="6" fill="#2b2b33"/>

    <!-- seat post + saddle -->
    <line x1="344" y1="310" x2="346" y2="322" stroke="#3a3f47" stroke-width="9" stroke-linecap="round"/>
    <path d="M308 324 Q336 308 372 318 Q368 336 342 340 Q320 340 308 324 Z" fill="#2b2b33"/>

    <!-- drivetrain -->
    <circle cx="380" cy="440" r="22" fill="none" stroke="#c9d4de" stroke-width="6"/>
    <circle cx="380" cy="440" r="9" fill="#5a6570"/>
    <circle cx="250" cy="440" r="12" fill="none" stroke="#c9d4de" stroke-width="5"/>
    <g stroke="#8f9ba6" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="368" y1="423" x2="258" y2="430"/>
      <line x1="368" y1="457" x2="258" y2="450"/>
    </g>

    <!-- cranks + pedals -->
    <g stroke="#3a3f47" stroke-width="9" stroke-linecap="round">
      <line x1="380" y1="440" x2="412" y2="462"/> <!-- forward crank -->
      <line x1="380" y1="440" x2="350" y2="418"/> <!-- rear crank -->
    </g>
    <rect x="400" y="456" width="30" height="10" rx="4" fill="#2b2b33" transform="rotate(8 415 461)"/>
    <rect x="336" y="412" width="30" height="10" rx="4" fill="#2b2b33" transform="rotate(8 351 417)"/>
  </g>

  <!-- ================= pelican ================= -->
  <g id="pelican" transform="translate(0,-14)">
    <!-- far wing -->
    <path d="M330 250 Q300 226 268 236 Q288 258 316 272 Z" fill="#cdd8e4"/>

    <!-- tail -->
    <path d="M302 296 Q252 268 224 286 Q246 304 268 312 Q290 320 306 318 Z" fill="#dde5ee"/>
    <path d="M292 306 Q256 296 236 302 Q252 312 272 318 Q288 322 298 320 Z" fill="#c3cfdd" opacity="0.8"/>

    <!-- legs -->
    <g stroke="#eaa03c" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M368 320 Q392 372 408 468"/>   <!-- forward leg -->
      <path d="M344 322 Q340 374 350 426"/>   <!-- rear leg -->
    </g>
    <g fill="#d98c22">
      <path d="M400 466 L432 470 L432 482 L400 482 Q394 474 400 466 Z"/>
      <path d="M336 422 L366 426 L366 438 L336 438 Q330 430 336 422 Z"/>
    </g>

    <!-- body -->
    <ellipse cx="358" cy="288" rx="66" ry="54" fill="url(#bodyFill)" stroke="#b9c6d4" stroke-width="2.5"/>

    <!-- near wing -->
    <path d="M382 250 Q430 258 428 300 Q424 334 386 344 Q360 336 342 310 Q348 272 382 250 Z"
          fill="#eef2f7" stroke="#b9c6d4" stroke-width="2.5"/>
    <g stroke="#c6d2df" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M372 268 Q400 282 404 316"/>
      <path d="M360 284 Q388 300 392 326"/>
      <path d="M384 262 Q412 274 416 300"/>
    </g>

    <!-- neck -->
    <path d="M392 262 Q408 214 424 182 L464 200 Q442 240 432 276 Z"
          fill="url(#bodyFill)" stroke="#b9c6d4" stroke-width="2.5"/>

    <!-- head -->
    <circle cx="448" cy="186" r="35" fill="#ffffff" stroke="#b9c6d4" stroke-width="2.5"/>
    <circle cx="462" cy="179" r="5.5" fill="#232b33"/>
    <circle cx="464" cy="177" r="2" fill="#ffffff"/>
    <path d="M430 158 Q438 146 452 148" stroke="#c6d2df" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- helmet -->
    <path d="M412 178 Q420 136 458 138 Q486 142 486 170 Q462 158 436 164 Q422 167 412 178 Z"
          fill="#ef5350" stroke="#c62828" stroke-width="2.5"/>
    <path d="M436 162 L444 140 L456 140 L450 158 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M412 176 Q448 168 486 168" stroke="#c62828" stroke-width="3" fill="none"/>

    <!-- upper beak -->
    <path d="M468 168 Q560 172 612 214 Q586 222 534 216 Q498 212 466 200 Z"
          fill="url(#beakFill)" stroke="#d9821c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M474 176 Q552 182 600 212" stroke="#fff1c9" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- pouch -->
    <path d="M466 198 Q508 218 560 214 Q598 214 610 218 Q600 262 552 274 Q498 278 466 244 Q452 222 466 198 Z"
          fill="url(#pouchFill)" stroke="#d9821c" stroke-width="2.5"/>
    <path d="M474 236 Q516 262 566 254" stroke="#c96f14" stroke-width="2.5" fill="none" opacity="0.65"/>

    <!-- fish peeking out of the pouch -->
    <g>
      <path d="M596 214 Q622 202 644 212 Q636 226 620 232 Q602 234 594 226 Z" fill="#8fd0e8" stroke="#3d93b5" stroke-width="2"/>
      <path d="M642 212 L664 200 L660 224 Z" fill="#7cc4de" stroke="#3d93b5" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="606" cy="217" r="3" fill="#22303a"/>
    </g>

    <!-- subtle body shading -->
    <path d="M312 306 Q330 340 372 340 Q344 326 330 300 Z" fill="#cdd8e4" opacity="0.55"/>
  </g>

  <!-- ground grass tufts -->
  <g stroke="#5f9e4a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M80 528 q6 -16 14 -22"/>
    <path d="M96 528 q-2 -18 4 -24"/>
    <path d="M700 528 q8 -18 16 -24"/>
    <path d="M722 528 q0 -20 8 -26"/>
  </g>
</svg>
