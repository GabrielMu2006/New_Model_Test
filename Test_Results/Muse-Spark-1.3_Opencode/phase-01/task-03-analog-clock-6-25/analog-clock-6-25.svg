<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 200 200">
  <title>Analog clock showing 6:25</title>
  <!-- Clock face -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- Minute ticks (48; hour positions omitted) -->
  <g stroke="#999" stroke-width="1">
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(6 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(12 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(18 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(24 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(36 100 100)"/>
