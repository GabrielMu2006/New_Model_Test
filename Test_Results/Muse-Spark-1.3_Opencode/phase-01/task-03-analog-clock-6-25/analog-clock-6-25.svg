    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(354 100 100)"/>
  </g>

  <!-- Hour markers (12) -->
  <g stroke="black" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="12" x2="100" y2="26"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(30 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(60 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(90 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(120 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(150 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(180 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(210 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(240 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(270 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(300 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(330 100 100)"/>
  </g>

  <!-- Hour numbers -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">
    <text x="100" y="40">12</text>
    <text x="132.5" y="48.71">1</text>
    <text x="156.29" y="72.5">2</text>
    <text x="160" y="100">3</text>
    <text x="156.29" y="132.5">4</text>
    <text x="132.5" y="156.29">5</text>
    <text x="100" y="160">6</text>
    <text x="67.5" y="156.29">7</text>
    <text x="43.71" y="132.5">8</text>
    <text x="40" y="100">9</text>
    <text x="43.71" y="67.5">10</text>
    <text x="67.5" y="48.71">11</text>
  </g>

  <!-- Hour hand: 6 + 25/60 = 6.4167h -> 192.5 deg -->
  <line x1="100" y1="100" x2="100" y2="60" stroke="black" stroke-width="6" stroke-linecap="round" transform="rotate(192.5 100 100)"/>
  <!-- Minute hand: 25 min -> 150 deg -->
  <line x1="100" y1="100" x2="100" y2="35" stroke="black" stroke-width="4" stroke-linecap="round" transform="rotate(150 100 100)"/>
  <!-- Second hand: 0 sec -> 0 deg (pointing at 12) -->
  <line x1="100" y1="112" x2="100" y2="25" stroke="red" stroke-width="1.5" stroke-linecap="round" transform="rotate(0 100 100)"/>

  <!-- Center pin -->
  <circle cx="100" cy="100" r="5" fill="black"/>
  <circle cx="100" cy="100" r="2" fill="red"/>
</svg>
