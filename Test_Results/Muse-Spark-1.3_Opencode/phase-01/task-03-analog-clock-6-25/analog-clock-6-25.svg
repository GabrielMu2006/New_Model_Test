    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(192 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(198 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(204 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(216 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(222 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(228 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(234 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(246 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(252 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(258 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(264 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(276 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(282 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(288 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(294 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(306 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(312 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="17" transform="rotate(318 100 100)"/>
