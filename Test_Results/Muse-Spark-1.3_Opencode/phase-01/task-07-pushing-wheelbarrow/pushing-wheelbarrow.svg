<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
<title id="title">Person pushing a wheelbarrow in side view</title>
<desc id="desc">Side view facing right. A person stands behind (to the left of) a wheelbarrow, leaning forward with both hands gripping the handles and pushing the barrow forward to the right. The wheelbarrow's single wheel is in front on the right, load in the bucket, support legs and handles trailing behind to the pusher. This is pushing, not pulling.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7DD3FC"/>
    <stop offset="70%" stop-color="#E0F2FE"/>
    <stop offset="100%" stop-color="#F0FDFA"/>
  </linearGradient>
  <linearGradient id="bucketGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94A3B8"/>
    <stop offset="50%" stop-color="#64748B"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect x="0" y="0" width="800" height="600" fill="url(#sky)" rx="16"/>
<circle cx="660" cy="90" r="58" fill="#FFD93D" opacity="0.3"/>
<circle cx="660" cy="90" r="42" fill="#FFD93D" stroke="#F59E0B" stroke-width="3"/>
<g fill="white" opacity="0.95">
  <ellipse cx="140" cy="105" rx="45" ry="22"/>
  <ellipse cx="175" cy="95" rx="35" ry="20"/>
  <ellipse cx="420" cy="75" rx="38" ry="18"/>
  <ellipse cx="450" cy="68" rx="28" ry="15"/>
</g>
<rect x="0" y="420" width="800" height="110" fill="#4ADE80"/>
<rect x="0" y="420" width="800" height="12" fill="#22C55E"/>
<rect x="0" y="470" width="800" height="130" fill="#A16207" opacity="0.25"/>
<rect x="0" y="470" width="800" height="8" fill="#57534E"/>
<g fill="#57534E" opacity="0.3">
  <ellipse cx="150" cy="540" rx="80" ry="10"/>
  <ellipse cx="550" cy="540" rx="110" ry="12"/>
</g>

<!-- Direction banner -->
<g font-family="Arial, sans-serif">
  <rect x="12" y="12" width="430" height="78" rx="10" fill="white" opacity="0.93" stroke="#334155" stroke-width="2"/>
  <text x="24" y="36" font-size="15" font-weight="bold" fill="#0F172A">PUSHING (not pulling) • moves → right</text>
  <text x="24" y="57" font-size="13" fill="#15803D">● Person BEHIND barrow, hands push handles</text>
  <text x="24" y="76" font-size="13" fill="#57534E">● Wheel in FRONT, legs trailing behind</text>
</g>

<!-- Motion arrow -->
<g>
  <line x1="80" y1="150" x2="700" y2="150" stroke="#16A34A" stroke-width="6" stroke-dasharray="18 12" stroke-linecap="round" opacity="0.9"/>
  <polygon points="700,150 672,134 672,166" fill="#16A34A"/>
  <rect x="330" y="130" width="150" height="36" rx="18" fill="#16A34A"/>
  <text x="405" y="154" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">PUSH →</text>
</g>

<!-- Shadows -->
<ellipse cx="200" cy="490" rx="110" ry="12" fill="black" opacity="0.15"/>
<ellipse cx="500" cy="492" rx="150" ry="12" fill="black" opacity="0.15"/>

<!-- ===== WHEELBARROW (in front, right side) ===== -->
<g id="wheelbarrow">
  <!-- Far handle (slightly offset, darker) -->
  <line x1="380" y1="365" x2="256" y2="318" stroke="#78350F" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- Support leg (rear) -->
  <line x1="395" y1="405" x2="400" y2="478" stroke="#374151" stroke-width="10" stroke-linecap="round"/>
  <line x1="385" y1="478" x2="415" y2="478" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <!-- Front support strut to wheel -->
  <line x1="490" y1="405" x2="550" y2="445" stroke="#374151" stroke-width="10" stroke-linecap="round"/>
  <!-- Bucket body - trapezoid -->
  <polygon points="330,290 600,290 525,410 375,410" fill="url(#bucketGrad)" stroke="#1F2937" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="330,290 600,290 590,310 340,310" fill="#CBD5E1" stroke="#1F2937" stroke-width="3" stroke-linejoin="round"/>
  <!-- Side rib -->
  <line x1="465" y1="310" x2="450" y2="410" stroke="#1F2937" stroke-width="3" opacity="0.6"/>
  <!-- Dirt load -->
  <ellipse cx="465" cy="290" rx="110" ry="32" fill="#92400E" stroke="#451A03" stroke-width="3"/>
  <ellipse cx="435" cy="278" rx="40" ry="18" fill="#A16207"/>
  <ellipse cx="495" cy="275" rx="35" ry="16" fill="#A16207"/>
  <circle cx="460" cy="265" r="8" fill="#78350F"/>
  <circle cx="485" cy="268" r="6" fill="#78350F"/>
  <!-- Wheel (front, right) -->
  <g transform="translate(552,445)">
    <circle r="38" fill="#1F2937"/>
    <circle r="26" fill="#9CA3AF" stroke="#E5E7EB" stroke-width="3"/>
    <circle r="8" fill="#374151" stroke="white" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#4B5563" stroke-width="3"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#4B5563" stroke-width="3"/>
  </g>
  <!-- Near handle (wood) -->
  <line x1="385" y1="375" x2="248" y2="330" stroke="#B45309" stroke-width="10" stroke-linecap="round"/>
  <line x1="385" y1="375" x2="248" y2="330" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Grip -->
  <rect x="220" y="318" width="40" height="16" rx="8" fill="#1F2937" transform="rotate(-12 240 326)"/>
</g>

<!-- ===== PERSON (behind, left side, pushing) ===== -->
<g id="person">
  <!-- Back leg (far, left) - stepped back -->
  <g opacity="0.65">
    <line x1="195" y1="355" x2="145" y2="415" stroke="#1E3A8A" stroke-width="14" stroke-linecap="round"/>
    <line x1="145" y1="415" x2="115" y2="475" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- Front leg (near, right) - stepped forward, driving push -->
  <g>
    <line x1="195" y1="355" x2="240" y2="410" stroke="#2563EB" stroke-width="16" stroke-linecap="round"/>
    <line x1="240" y1="410" x2="265" y2="472" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Shoes -->
  <ellipse cx="108" cy="483" rx="24" ry="10" fill="#374151" stroke="#111827" stroke-width="2"/>
  <ellipse cx="272" cy="483" rx="26" ry="10" fill="#111827" stroke="white" stroke-width="2"/>
  <!-- Torso leaning forward into push -->
  <line x1="195" y1="355" x2="245" y2="275" stroke="#0E9594" stroke-width="28" stroke-linecap="round"/>
  <line x1="195" y1="355" x2="245" y2="275" stroke="#14B8A6" stroke-width="19" stroke-linecap="round"/>
  <circle cx="195" cy="355" r="16" fill="#1E40AF"/>
  <circle cx="245" cy="275" r="12" fill="#0E9594" stroke="#134E4A" stroke-width="2"/>
  <!-- Far arm (slightly behind, muted) -->
  <g opacity="0.65">
    <line x1="245" y1="275" x2="258" y2="300" stroke="#0F766E" stroke-width="10" stroke-linecap="round"/>
    <line x1="258" y1="300" x2="252" y2="322" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- Near arm extended forward to handle -->
  <g>
    <line x1="245" y1="275" x2="265" y2="305" stroke="#0F766E" stroke-width="12" stroke-linecap="round"/>
    <line x1="265" y1="305" x2="240" y2="330" stroke="#FDBA74" stroke-width="11" stroke-linecap="round"/>
    <circle cx="265" cy="305" r="7" fill="#0F766E"/>
  </g>
  <!-- Neck + head facing right (toward barrow) -->
  <line x1="245" y1="275" x2="262" y2="242" stroke="#FDBA74" stroke-width="12" stroke-linecap="round"/>
  <circle cx="276" cy="218" r="28" fill="#FFD6A5" stroke="#92400E" stroke-width="3"/>
  <!-- Cap -->
  <path d="M 248 212 Q 252 188 276 186 Q 300 188 304 212 L 304 216 L 248 216 Z" fill="#2563EB" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round"/>
  <rect x="300" y="208" width="26" height="8" rx="4" fill="#1E3A8A"/>
  <circle cx="286" cy="218" r="3.5" fill="#1F2937"/>
  <path d="M 292 232 Q 298 234 302 230" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Hands gripping handle -->
  <circle cx="252" cy="322" r="10" fill="#FDBA74" stroke="#92400E" stroke-width="3" opacity="0.9"/>
  <circle cx="240" cy="330" r="11" fill="#FDBA74" stroke="#92400E" stroke-width="3"/>
</g>

<!-- Force arrow from hands into barrow -->
<g>
  <line x1="270" y1="330" x2="370" y2="365" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <polygon points="370,365 354,353 354,374" fill="#DC2626"/>
  <rect x="275" y="340" width="70" height="22" rx="6" fill="#DC2626"/>
  <text x="310" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">push</text>
</g>

<!-- Labels -->
<g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
  <rect x="60" y="505" width="140" height="30" rx="8" fill="#1D4ED8"/>
  <text x="130" y="525" fill="white" text-anchor="middle">PERSON (behind)</text>
  <rect x="470" y="505" width="170" height="30" rx="8" fill="#374151"/>
  <text x="555" y="525" fill="white" text-anchor="middle">WHEELBARROW (front)</text>
</g>

</svg>