<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Analog clock showing 11:52:30">
  <title>Analog clock showing 11:52:30</title>
  <!-- Face -->
  <circle cx="100" cy="100" r="96" fill="#1a1a1a"/>
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Minute ticks -->
  <g id="minute-ticks" stroke="#333333" stroke-width="1">
    <line x1="100" y1="10" x2="100" y2="16"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(6 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(12 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(18 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(24 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(36 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(42 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(48 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(54 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(66 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(72 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(78 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(84 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(96 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(102 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(108 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(114 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(126 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(132 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(138 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(144 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(156 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(162 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(168 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(174 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(186 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(192 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(198 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(204 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(216 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(222 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(228 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(234 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(246 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(252 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(258 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(264 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(276 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(282 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(288 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(294 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(306 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(312 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(318 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(324 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(336 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(342 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(348 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="16" transform="rotate(354 100 100)"/>
  </g>

  <!-- Hour ticks -->
  <g id="hour-ticks" stroke="#111111" stroke-width="3.5" stroke-linecap="round">
    <line x1="100" y1="10" x2="100" y2="22"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(30 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(60 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(90 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(120 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(150 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(180 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(210 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(240 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(270 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(300 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="22" transform="rotate(330 100 100)"/>
  </g>

  <!-- Numbers -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="34">12</text>
    <text x="133" y="43">1</text>
    <text x="157" y="67">2</text>
    <text x="166" y="100">3</text>
    <text x="157" y="133">4</text>
    <text x="133" y="157">5</text>
    <text x="100" y="166">6</text>
    <text x="67" y="157">7</text>
    <text x="43" y="133">8</text>
    <text x="34" y="100">9</text>
    <text x="43" y="67">10</text>
    <text x="67" y="43">11</text>
  </g>

  <!-- Hands: 11:52:30 -->
  <!-- Hour: (11 + 52/60 + 30/3600) * 30 = 356.25 deg -->
  <g id="hour-hand" transform="rotate(356.25 100 100)">
    <line x1="100" y1="112" x2="100" y2="54" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Minute: (52 + 30/60) * 6 = 315 deg -->
  <g id="minute-hand" transform="rotate(315 100 100)">
    <line x1="100" y1="114" x2="100" y2="32" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Second: 30 * 6 = 180 deg -->
  <g id="second-hand" transform="rotate(180 100 100)">
    <line x1="100" y1="120" x2="100" y2="24" stroke="#d40000" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Center -->
  <circle cx="100" cy="100" r="5.5" fill="#111111"/>
  <circle cx="100" cy="100" r="2.5" fill="#d40000"/>

  <!-- Digital label -->
  <text x="100" y="140" font-family="monospace" font-size="9" fill="#555555" text-anchor="middle">11:52:30</text>
</svg>
