<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Hand using scissors to cut a sheet of paper">
  <title>Hand cutting paper with scissors</title>
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdbb4"/>
      <stop offset="100%" stop-color="#f0b285"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="640" height="480" rx="24" fill="#eef3f8"/>
  <rect x="0" y="0" width="640" height="480" rx="24" fill="none" stroke="#dbe3ec" stroke-width="2"/>

  <!-- table shadow under paper -->
  <rect x="332" y="52" width="240" height="400" rx="6" fill="#0f172a" opacity="0.12"/>

  <!-- paper sheet -->
  <g filter="url(#softShadow)">
    <rect x="320" y="40" width="240" height="400" rx="6" fill="url(#paperGrad)" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- faint ruled lines (above and below cut to not cross cut) -->
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="350" y1="90" x2="530" y2="90"/>
      <line x1="350" y1="120" x2="530" y2="120"/>
      <line x1="350" y1="150" x2="530" y2="150"/>
      <line x1="350" y1="330" x2="530" y2="330"/>
      <line x1="350" y1="360" x2="530" y2="360"/>
      <line x1="350" y1="390" x2="530" y2="390"/>
    </g>
    <!-- folded corner -->
    <path d="M 520 40 L 560 40 L 560 80 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 520 40 L 520 80 L 560 80" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- cut: solid open slit on left part + dashed guide on right -->
  <!-- white gap to show separation -->
  <rect x="320" y="234" width="140" height="12" fill="#eef3f8"/>
  <!-- upper and lower cut edges with slight roughness -->
  <path d="M320 234 L460 234" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M320 246 L460 246" stroke="#64748b" stroke-width="2" fill="none"/>
  <!-- V notch where scissors enters -->
  <path d="M320 230 L336 240 L320 250 Z" fill="#eef3f8" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
  <!-- dashed cutting guide ahead of scissors -->
  <line x1="466" y1="240" x2="540" y2="240" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round"/>
  <!-- small scissors icon at end? no -->

  <!-- falling cut-off strip -->
  <g transform="rotate(18 380 360)" filter="url(#softShadow)">
    <rect x="340" y="330" width="140" height="36" rx="3" fill="white" stroke="#94a3b8" stroke-width="2"/>
    <path d="M340 330 L354 348 L340 366 Z" fill="#eef3f8" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- motion sparkles near blades -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="478" y1="200" x2="488" y2="185"/>
    <line x1="494" y1="218" x2="508" y2="212"/>
    <line x1="478" y1="280" x2="488" y2="295"/>
  </g>

  <!-- ===== SCISSORS ===== -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- shanks / blades (silver) -->
    <!-- lower blade (comes from upper handle) -->
    <path d="M 195 200 L 325 232 L 475 214 L 475 230 L 322 246 Z"
          fill="url(#bladeGrad)" stroke="#475569" stroke-width="2.5"/>
    <!-- upper blade (comes from lower handle) -->
    <path d="M 195 300 L 325 250 L 475 256 L 475 272 L 322 252 Z"
          fill="url(#bladeGrad)" stroke="#475569" stroke-width="2.5"/>
    <!-- blade center ridge highlight -->
    <line x1="330" y1="239" x2="460" y2="224" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="330" y1="251" x2="460" y2="262" stroke="white" stroke-width="1.5" opacity="0.8"/>

    <!-- pivot screw -->
    <circle cx="322" cy="241" r="13" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <circle cx="322" cy="241" r="7.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <line x1="317" y1="241" x2="327" y2="241" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- handles (red plastic) -->
    <!-- upper handle loop -->
    <ellipse cx="135" cy="180" rx="52" ry="34" fill="none" stroke="#1e293b" stroke-width="24"/>
    <ellipse cx="135" cy="180" rx="52" ry="34" fill="none" stroke="#ef4444" stroke-width="16"/>
    <ellipse cx="135" cy="180" rx="52" ry="34" fill="none" stroke="#fecaca" stroke-width="4" opacity="0.7" stroke-dasharray="30 120" stroke-linecap="round" transform="rotate(-20 135 180)"/>
    <!-- lower handle loop -->
    <ellipse cx="135" cy="305" rx="56" ry="36" fill="none" stroke="#1e293b" stroke-width="26"/>
    <ellipse cx="135" cy="305" rx="56" ry="36" fill="none" stroke="#ef4444" stroke-width="18"/>
    <ellipse cx="135" cy="305" rx="56" ry="36" fill="none" stroke="#fecaca" stroke-width="4" opacity="0.7" stroke-dasharray="30 120" stroke-linecap="round" transform="rotate(-25 135 305)"/>

    <!-- shank covers where handles meet metal -->
    <path d="M 183 188 L 220 206 L 212 220 L 175 202 Z" fill="#ef4444" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M 183 298 L 220 280 L 212 266 L 175 284 Z" fill="#ef4444" stroke="#1e293b" stroke-width="2.5"/>
  </g>

  <!-- ===== HAND ===== -->
  <g filter="url(#softShadow)">
    <!-- shirt sleeve -->
    <rect x="0" y="170" width="86" height="150" rx="14" fill="#2563eb" stroke="#1e293b" stroke-width="3"/>
    <rect x="66" y="180" width="28" height="130" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>

    <!-- palm / back of hand -->
    <path d="M 90 195
             C 125 185, 165 195, 178 225
             C 188 250, 188 285, 176 310
             C 162 335, 120 340, 90 325
             L 90 195 Z"
          fill="url(#skinGrad)" stroke="#7c4a2d" stroke-width="3" stroke-linejoin="round"/>

    <!-- thumb through upper loop -->
    <path d="M 115 240 C 135 225, 160 205, 180 192"
          fill="none" stroke="#7c4a2d" stroke-width="32" stroke-linecap="round"/>
    <path d="M 115 240 C 135 225, 160 205, 180 192"
          fill="none" stroke="url(#skinGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- thumb nail -->
    <ellipse cx="172" cy="194" rx="9" ry="6.5" fill="#ffe4e6" stroke="#7c4a2d" stroke-width="2" transform="rotate(-30 172 194)"/>

    <!-- three fingers through lower loop -->
    <g fill="none" stroke-linecap="round">
      <path d="M 115 272 C 140 278, 165 283, 186 285" stroke="#7c4a2d" stroke-width="28"/>
      <path d="M 115 272 C 140 278, 165 283, 186 285" stroke="url(#skinGrad)" stroke-width="20"/>
      <path d="M 113 296 C 138 300, 163 303, 184 303" stroke="#7c4a2d" stroke-width="28"/>
      <path d="M 113 296 C 138 300, 163 303, 184 303" stroke="url(#skinGrad)" stroke-width="20"/>
      <path d="M 112 318 C 134 320, 155 320, 172 318" stroke="#7c4a2d" stroke-width="24"/>
      <path d="M 112 318 C 134 320, 155 320, 172 318" stroke="url(#skinGrad)" stroke-width="16"/>
    </g>
    <!-- finger nails / knuckle lines -->
    <g stroke="#7c4a2d" stroke-width="1.8" opacity="0.7" fill="none">
      <path d="M 130 262 Q 135 270 132 278"/>
      <path d="M 130 288 Q 135 295 132 303"/>
    </g>
    <ellipse cx="180" cy="285" rx="6" ry="4.5" fill="#ffe4e6" stroke="#7c4a2d" stroke-width="1.5"/>
    <ellipse cx="178" cy="303" rx="6" ry="4.5" fill="#ffe4e6" stroke="#7c4a2d" stroke-width="1.5"/>

    <!-- palm crease -->
    <path d="M 105 230 Q 125 260 110 310" fill="none" stroke="#b97a4a" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- outline sparkle to emphasize cutting point -->
  <circle cx="465" cy="240" r="6" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.25"/>
</svg>
