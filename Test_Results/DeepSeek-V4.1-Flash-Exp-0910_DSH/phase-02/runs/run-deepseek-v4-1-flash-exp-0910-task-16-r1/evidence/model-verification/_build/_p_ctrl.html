<title id="svg-title">Pelican riding a bicycle</title>

<style><![CDATA[#toggle-anim{cursor:pointer}#toggle-anim:hover .btn-bg{fill:#eef8fa}#toggle-anim:focus{outline:none}#toggle-anim:focus .btn-bg{stroke-width:3.4}]]></style>
<script><![CDATA[
(function(){
  var svg=document.getElementById("pelican-svg");
  var btn=document.getElementById("toggle-anim");
  var label=document.getElementById("toggle-label");
  var ip=document.getElementById("icon-play");
  var ic=document.getElementById("icon-pause");
  var paused=false;
  function paint(){
    label.textContent=paused?"Resume":"Pause";
    ip.style.display=paused?"":"none";
    ic.style.display=paused?"none":"";
    btn.setAttribute("aria-pressed",paused?"true":"false");
    btn.setAttribute("aria-label",paused?"Resume animation":"Pause animation");
  }
  function setPaused(p){
    paused=p;
    if(p){svg.pauseAnimations();}else{svg.unpauseAnimations();}
    paint();
  }
  btn.addEventListener("click",function(){setPaused(!paused);});
  btn.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();setPaused(!paused);}else if(e.key==="Escape"&&paused){setPaused(false);}
  });
  paint();
})();
]]></script>
</svg>
<script>document.getElementById('pelican-svg').pauseAnimations();</script>
