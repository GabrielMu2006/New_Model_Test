<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf — screenshot harness</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
<script>
  // Never screenshot a previous run's persisted library.
  try { localStorage.removeItem('book-tracker.v1'); } catch (err) { /* ignore */ }
</script>
</head>
<body>
<script>
  var frame = document.createElement('iframe');
  frame.src = 'index.html';
  document.body.appendChild(frame);

  (function wait() {
    var win = null;
    try { win = frame.contentWindow; } catch (err) { win = null; }
    if (!(win && win.BookApp && win.BookApp.state && win.BookApp.state.books)) {
      return setTimeout(wait, 50);
    }
    var app = win.BookApp;
    var scene = (location.search.match(/scene=([a-z]+)/) || [])[1] || 'library';

    if (scene === 'empty') {
      app.actions.clearAll();
    } else {
      app.actions.loadSamples();
      app.actions.setSort('recent');
      if (scene === 'detail') app.openDetail('b_sample_dune');
      if (scene === 'stats') app.openStats();
      if (scene === 'form') {
        app.openEditor(null);
        var set = function (id, v) { var el = frame.contentDocument.getElementById(id); el.value = v; };
        set('f-title', 'The Left Hand of Darkness');
        set('f-author', 'Ursula K. Le Guin');
        set('f-genre', 'Science fiction');
        set('f-pages', '304');
        set('f-page', '120');
        frame.contentDocument.querySelector('#status-input [data-status="reading"]').click();
      }
      if (scene === 'list') app.actions.setView('list');
    }
    app.render();

    // Never screenshot a toast.
    setTimeout(function () {
      var host = frame.contentDocument.getElementById('toasts');
      if (host) host.innerHTML = '';
    }, 400);
  })();
</script>
</body>
</html>
