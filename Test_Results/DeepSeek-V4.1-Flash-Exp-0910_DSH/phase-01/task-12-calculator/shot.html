<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator — screenshot harness</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
<script>
  // Never screenshot a previous run's persisted history.
  try { localStorage.removeItem('calculator.v1'); } catch (err) { /* ignore */ }
</script>
</head>
<body>
<script>
  var frame = document.createElement('iframe');
  frame.src = 'index.html';
  document.body.appendChild(frame);

  function press(win, keys) {
    String(keys).split(' ').forEach(function (k) {
      if (/^\d+$/.test(k)) k.split('').forEach(function (d) { win.Calculator.pressKey(d); });
      else if (k !== '') win.Calculator.pressKey(k);
    });
  }

  var tries = 0;
  (function wait() {
    var win = null;
    try { win = frame.contentWindow; } catch (err) { win = null; }
    if (!(win && win.Calculator && win.Calculator.session)) {
      if (tries++ < 200) setTimeout(wait, 50);
      return;
    }
    // Two finished calculations for the history column ...
    press(win, '144 ÷ 12 =');
    press(win, '7 × 8 =');
    // ... and a part-typed expression: running total + the armed operator.
    press(win, '1 2 3 4 + 5 × 6');
  })();
</script>
</body>
</html>
