<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky -->
  <rect width="100%" height="100%" fill="#e8f4f8"/>

  <!-- Sun -->
  <circle cx="700" cy="100" r="40" fill="#f1c40f" opacity="0.6"/>
  <circle cx="700" cy="100" r="50" fill="#f1c40f" opacity="0.2"/>

  <!-- Cloud -->
  <path d="M 100 150 Q 120 130 140 150 Q 160 140 170 160 L 100 160 Z" fill="#fff" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="500" width="100%" height="100" fill="#d5e8d4"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#a8c8a8" stroke-width="2"/>

  <!-- Shadows -->
  <ellipse cx="270" cy="505" rx="60" ry="8" fill="#000" fill-opacity="0.1"/>
  <ellipse cx="580" cy="505" rx="35" ry="6" fill="#000" fill-opacity="0.1"/>

  <!-- Far Arm (behind everything) -->
  <line x1="315" y1="345" x2="350" y2="370" stroke="#d4ac0d" stroke-width="10" stroke-linecap="round"/>
  <line x1="350" y1="370" x2="395" y2="395" stroke="#d4ac0d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="395" cy="395" r="7" fill="#d4ac0d"/>

  <!-- Person's Body -->
  <!-- Legs -->
  <line x1="270" y1="420" x2="240" y2="500" stroke="#2c3e50" stroke-width="16" stroke-linecap="round"/>
  <line x1="280" y1="425" x2="290" y2="500" stroke="#2c3e50" stroke-width="16" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="240" cy="500" rx="15" ry="6" fill="#333"/>
  <ellipse cx="290" cy="500" rx="15" ry="6" fill="#333"/>
  <!-- Torso -->
  <path d="M 270 420 L 320 340 L 335 350 L 285 430 Z" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <!-- Sleeve -->
  <line x1="320" y1="340" x2="335" y2="355" stroke="#3498db" stroke-width="16" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="345" cy="310" r="20" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2"/>
  <!-- Cap -->
  <path d="M 325 310 Q 345 295 365 310 L 370 315 Q 345 305 320 315 Z" fill="#e74c3c"/>
  <!-- Face -->
  <circle cx="355" cy="315" r="2.5" fill="#333"/>
  <path d="M 350 322 Q 355 326 360 322" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Wheelbarrow -->
  <!-- Wheel -->
  <circle cx="580" cy="470" r="30" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="580" cy="470" r="24" fill="none" stroke="#ccc" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="580" y1="440" x2="580" y2="500" stroke="#aaa" stroke-width="1.5"/>
  <line x1="550" y1="470" x2="610" y2="470" stroke="#aaa" stroke-width="1.5"/>
  <line x1="559" y1="449" x2="601" y2="491" stroke="#aaa" stroke-width="1.5"/>
  <line x1="601" y1="449" x2="559" y2="491" stroke="#aaa" stroke-width="1.5"/>
  <!-- Axle -->
  <circle cx="580" cy="470" r="4" fill="#333"/>

  <!-- Tray -->
  <path d="M 440 465 L 560 475 L 555 455 L 550 415 L 450 405 Z" fill="#7f8c8d" stroke="#95a5a6" stroke-width="3"/>
  <!-- Tray Rim -->
  <line x1="450" y1="405" x2="550" y2="415" stroke="#95a5a6" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="465" x2="560" y2="475" stroke="#95a5a6" stroke-width="6" stroke-linecap="round"/>

  <!-- Load (Dirt) -->
  <path d="M 450 405 Q 500 385 550 415 Q 540 430 450 405 Z" fill="#8B4513"/>
  <circle cx="480" cy="400" r="5" fill="#6B3410"/>
  <circle cx="510" cy="405" r="6" fill="#6B3410"/>
  <circle cx="530" cy="410" r="4" fill="#6B3410"/>
  <circle cx="495" cy="395" r="3" fill="#A0522D"/>
  <circle cx="520" cy="400" r="4" fill="#A0522D"/>

  <!-- Handle -->
  <line x1="440" y1="465" x2="400" y2="390" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <!-- Handle Grip -->
  <line x1="410" y1="403" x2="400" y2="390" stroke="#333" stroke-width="12" stroke-linecap="round"/>

  <!-- Leg -->
  <line x1="460" y1="470" x2="460" y2="490" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="460" cy="490" rx="8" ry="4" fill="#333"/>

  <!-- Near Arm (in front of handle) -->
  <line x1="320" y1="340" x2="355" y2="365" stroke="#f1c40f" stroke-width="12" stroke-linecap="round"/>
  <line x1="355" y1="365" x2="400" y2="390" stroke="#f1c40f" stroke-width="10" stroke-linecap="round"/>
  <!-- Near Hand -->
  <circle cx="400" cy="390" r="8" fill="#f1c40f"/>

  <!-- Motion Lines -->
  <line x1="420" y1="380" x2="450" y2="380" stroke="#999" stroke-width="2" stroke-dasharray="4, 4"/>
  <line x1="420" y1="395" x2="460" y2="395" stroke="#999" stroke-width="2" stroke-dasharray="4, 4"/>

  <!-- Push-off Action Lines (back foot) -->
  <line x1="225" y1="510" x2="205" y2="510" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="230" y1="516" x2="210" y2="516" stroke="#999" stroke-width="2" stroke-linecap="round"/>
</svg>
