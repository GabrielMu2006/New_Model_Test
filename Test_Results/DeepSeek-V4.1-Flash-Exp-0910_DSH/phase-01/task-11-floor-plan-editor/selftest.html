         font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* The frame stays visible and unoccluded: headless Chrome gives an offscreen
     iframe a 0×0 layout, and throttles requestAnimationFrame for an occluded
     one, either of which would stop the canvas from ever sizing itself. */
