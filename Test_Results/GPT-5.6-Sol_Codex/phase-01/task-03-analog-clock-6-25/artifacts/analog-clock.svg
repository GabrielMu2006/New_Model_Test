<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Analog clock showing 6:25</title>
  <desc id="desc">A round analog clock with twelve hour markers, an hour hand between six and seven, a minute hand on five, and a second hand on twelve.</desc>

  <defs>
    <radialGradient id="face" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2f6"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10202c" flood-opacity="0.22"/>
    </filter>
    <line id="hour-mark" x1="256" y1="62" x2="256" y2="88" stroke="#17242d" stroke-width="8" stroke-linecap="round"/>
    <line id="minute-mark" x1="256" y1="65" x2="256" y2="77" stroke="#71808a" stroke-width="3" stroke-linecap="round"/>
  </defs>

  <circle cx="256" cy="256" r="224" fill="#d8e0e5" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="215" fill="url(#face)" stroke="#17242d" stroke-width="5"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#c8d2d9" stroke-width="1"/>

  <!-- Minute ticks; the heavier hour markers are layered over every fifth tick. -->
  <g>
    <use href="#minute-mark" transform="rotate(6 256 256)"/>
    <use href="#minute-mark" transform="rotate(12 256 256)"/>
    <use href="#minute-mark" transform="rotate(18 256 256)"/>
    <use href="#minute-mark" transform="rotate(24 256 256)"/>
    <use href="#minute-mark" transform="rotate(36 256 256)"/>
    <use href="#minute-mark" transform="rotate(42 256 256)"/>
    <use href="#minute-mark" transform="rotate(48 256 256)"/>
    <use href="#minute-mark" transform="rotate(54 256 256)"/>
    <use href="#minute-mark" transform="rotate(66 256 256)"/>
    <use href="#minute-mark" transform="rotate(72 256 256)"/>
    <use href="#minute-mark" transform="rotate(78 256 256)"/>
    <use href="#minute-mark" transform="rotate(84 256 256)"/>
    <use href="#minute-mark" transform="rotate(96 256 256)"/>
    <use href="#minute-mark" transform="rotate(102 256 256)"/>
    <use href="#minute-mark" transform="rotate(108 256 256)"/>
    <use href="#minute-mark" transform="rotate(114 256 256)"/>
    <use href="#minute-mark" transform="rotate(126 256 256)"/>
    <use href="#minute-mark" transform="rotate(132 256 256)"/>
    <use href="#minute-mark" transform="rotate(138 256 256)"/>
    <use href="#minute-mark" transform="rotate(144 256 256)"/>
    <use href="#minute-mark" transform="rotate(156 256 256)"/>
    <use href="#minute-mark" transform="rotate(162 256 256)"/>
    <use href="#minute-mark" transform="rotate(168 256 256)"/>
    <use href="#minute-mark" transform="rotate(174 256 256)"/>
    <use href="#minute-mark" transform="rotate(186 256 256)"/>
    <use href="#minute-mark" transform="rotate(192 256 256)"/>
    <use href="#minute-mark" transform="rotate(198 256 256)"/>
    <use href="#minute-mark" transform="rotate(204 256 256)"/>
    <use href="#minute-mark" transform="rotate(216 256 256)"/>
    <use href="#minute-mark" transform="rotate(222 256 256)"/>
    <use href="#minute-mark" transform="rotate(228 256 256)"/>
    <use href="#minute-mark" transform="rotate(234 256 256)"/>
    <use href="#minute-mark" transform="rotate(246 256 256)"/>
    <use href="#minute-mark" transform="rotate(252 256 256)"/>
    <use href="#minute-mark" transform="rotate(258 256 256)"/>
    <use href="#minute-mark" transform="rotate(264 256 256)"/>
    <use href="#minute-mark" transform="rotate(276 256 256)"/>
    <use href="#minute-mark" transform="rotate(282 256 256)"/>
    <use href="#minute-mark" transform="rotate(288 256 256)"/>
    <use href="#minute-mark" transform="rotate(294 256 256)"/>
    <use href="#minute-mark" transform="rotate(306 256 256)"/>
    <use href="#minute-mark" transform="rotate(312 256 256)"/>
    <use href="#minute-mark" transform="rotate(318 256 256)"/>
    <use href="#minute-mark" transform="rotate(324 256 256)"/>
    <use href="#minute-mark" transform="rotate(336 256 256)"/>
    <use href="#minute-mark" transform="rotate(342 256 256)"/>
    <use href="#minute-mark" transform="rotate(348 256 256)"/>
    <use href="#minute-mark" transform="rotate(354 256 256)"/>
  </g>

  <g>
    <use href="#hour-mark"/>
    <use href="#hour-mark" transform="rotate(30 256 256)"/>
    <use href="#hour-mark" transform="rotate(60 256 256)"/>
    <use href="#hour-mark" transform="rotate(90 256 256)"/>
    <use href="#hour-mark" transform="rotate(120 256 256)"/>
    <use href="#hour-mark" transform="rotate(150 256 256)"/>
    <use href="#hour-mark" transform="rotate(180 256 256)"/>
    <use href="#hour-mark" transform="rotate(210 256 256)"/>
    <use href="#hour-mark" transform="rotate(240 256 256)"/>
    <use href="#hour-mark" transform="rotate(270 256 256)"/>
    <use href="#hour-mark" transform="rotate(300 256 256)"/>
    <use href="#hour-mark" transform="rotate(330 256 256)"/>
  </g>

  <!-- At 6:25: hour = 192.5 degrees, minute = 150 degrees, second = 0 degrees. -->
  <g stroke-linecap="round">
    <line x1="256" y1="270" x2="256" y2="153" stroke="#17242d" stroke-width="16" transform="rotate(192.5 256 256)"/>
    <line x1="256" y1="278" x2="256" y2="105" stroke="#35596e" stroke-width="10" transform="rotate(150 256 256)"/>
    <line x1="256" y1="289" x2="256" y2="91" stroke="#e14c3b" stroke-width="4"/>
  </g>

  <circle cx="256" cy="256" r="15" fill="#17242d"/>
  <circle cx="256" cy="256" r="7" fill="#e14c3b"/>
</svg>
