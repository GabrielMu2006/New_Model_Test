<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Analog clock showing 11:52:30</title>
  <desc id="desc">A classic round analog clock with the hour hand just before twelve, the minute hand between ten and eleven, and the second hand pointing at six.</desc>

  <defs>
    <radialGradient id="face" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#e8e1d3"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55606b"/>
      <stop offset="0.45" stop-color="#171c22"/>
      <stop offset="0.72" stop-color="#404a54"/>
      <stop offset="1" stop-color="#0f1318"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1118" flood-opacity="0.28"/>
    </filter>
    <filter id="handShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Case and dial -->
  <circle cx="256" cy="256" r="235" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="221" fill="url(#face)" stroke="#b9b09e" stroke-width="2"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#d4cec1" stroke-width="1"/>

  <!-- Tick ring: each dash is one minute -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#737b82" stroke-width="3"
          stroke-dasharray="2 18.525" stroke-linecap="round" transform="rotate(-0.28 256 256)"/>

  <!-- Hour ticks -->
  <g stroke="#20272d" stroke-width="7" stroke-linecap="round">
    <path d="M256 55V76"/>
    <path d="M256 55V76" transform="rotate(30 256 256)"/>
    <path d="M256 55V76" transform="rotate(60 256 256)"/>
    <path d="M256 55V76" transform="rotate(90 256 256)"/>
    <path d="M256 55V76" transform="rotate(120 256 256)"/>
    <path d="M256 55V76" transform="rotate(150 256 256)"/>
    <path d="M256 55V76" transform="rotate(180 256 256)"/>
    <path d="M256 55V76" transform="rotate(210 256 256)"/>
    <path d="M256 55V76" transform="rotate(240 256 256)"/>
    <path d="M256 55V76" transform="rotate(270 256 256)"/>
    <path d="M256 55V76" transform="rotate(300 256 256)"/>
    <path d="M256 55V76" transform="rotate(330 256 256)"/>
  </g>

  <!-- Cardinal numerals -->
  <g fill="#20272d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" text-anchor="middle">
    <text x="256" y="113">12</text>
    <text x="399" y="267">3</text>
    <text x="256" y="421">6</text>
    <text x="113" y="267">9</text>
  </g>

  <text x="256" y="174" fill="#687078" font-family="Arial, sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">CLASSIC</text>
  <text x="256" y="352" fill="#8b867c" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">QUARTZ</text>

  <!-- Hands: hour 356.25°, minute 315°, second 180° -->
  <g filter="url(#handShadow)">
    <path d="M248 270 L251 163 Q256 149 261 163 L264 270 Z" fill="#20272d" transform="rotate(356.25 256 256)"/>
    <path d="M251 273 L253 102 Q256 91 259 102 L261 273 Z" fill="#313a42" transform="rotate(315 256 256)"/>
  </g>

  <!-- Counterbalanced seconds hand -->
  <g transform="rotate(180 256 256)">
    <path d="M254.5 286 L255 83 Q256 77 257 83 L257.5 286 Z" fill="#c83b34"/>
    <circle cx="256" cy="299" r="10" fill="none" stroke="#c83b34" stroke-width="3"/>
  </g>

  <!-- Center pin -->
  <circle cx="256" cy="256" r="12" fill="#171c22" stroke="#4e5962" stroke-width="2"/>
  <circle cx="256" cy="256" r="5" fill="#c83b34"/>

  <!-- Subtle glass highlight -->
  <path d="M94 181 A190 190 0 0 1 380 91" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.18"/>
</svg>
