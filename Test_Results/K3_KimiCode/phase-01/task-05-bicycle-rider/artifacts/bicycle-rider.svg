<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Cyclist riding a bicycle — side view</title>
  <desc id="desc">Side view of a person riding a bicycle. The left foot is on the lower pedal, the right foot is on the upper pedal, and both hands are holding the handlebars.</desc>

  <defs>
    <line id="spoke" x1="0" y1="-78" x2="0" y2="-13" stroke="#cbd5e1" stroke-width="2"/>
  </defs>

  <rect width="800" height="640" fill="#ffffff"/>
  <line x1="60" y1="586" x2="740" y2="586" stroke="#9ca3af" stroke-width="3"/>
  <ellipse cx="215" cy="589" rx="78" ry="6" fill="#000000" opacity="0.06"/>
  <ellipse cx="585" cy="589" rx="78" ry="6" fill="#000000" opacity="0.06"/>

  <!-- rear wheel -->
  <g transform="translate(215 485)">
    <circle r="95" fill="none" stroke="#111827" stroke-width="13"/>
    <circle r="81" fill="none" stroke="#9ca3af" stroke-width="5"/>
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(30)"/>
    <use href="#spoke" transform="rotate(60)"/>
    <use href="#spoke" transform="rotate(90)"/>
    <use href="#spoke" transform="rotate(120)"/>
    <use href="#spoke" transform="rotate(150)"/>
    <use href="#spoke" transform="rotate(180)"/>
    <use href="#spoke" transform="rotate(210)"/>
    <use href="#spoke" transform="rotate(240)"/>
    <use href="#spoke" transform="rotate(270)"/>
    <use href="#spoke" transform="rotate(300)"/>
    <use href="#spoke" transform="rotate(330)"/>
    <circle r="8" fill="#4b5563"/>
  </g>

  <!-- front wheel -->
  <g transform="translate(585 485)">
    <circle r="95" fill="none" stroke="#111827" stroke-width="13"/>
    <circle r="81" fill="none" stroke="#9ca3af" stroke-width="5"/>
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(30)"/>
    <use href="#spoke" transform="rotate(60)"/>
    <use href="#spoke" transform="rotate(90)"/>
    <use href="#spoke" transform="rotate(120)"/>
    <use href="#spoke" transform="rotate(150)"/>
    <use href="#spoke" transform="rotate(180)"/>
    <use href="#spoke" transform="rotate(210)"/>
    <use href="#spoke" transform="rotate(240)"/>
    <use href="#spoke" transform="rotate(270)"/>
    <use href="#spoke" transform="rotate(300)"/>
    <use href="#spoke" transform="rotate(330)"/>
    <circle r="8" fill="#4b5563"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#dc2626" stroke-linecap="round">
    <line x1="320" y1="324" x2="215" y2="485" stroke-width="6"/>
    <line x1="365" y1="492" x2="215" y2="485" stroke-width="6"/>
    <line x1="318" y1="322" x2="518" y2="300" stroke-width="9"/>
    <line x1="365" y1="492" x2="536" y2="348" stroke-width="10"/>
    <line x1="365" y1="492" x2="318" y2="318" stroke-width="9"/>
    <line x1="518" y1="296" x2="536" y2="348" stroke-width="11"/>
    <line x1="536" y1="348" x2="585" y2="485" stroke-width="8"/>
  </g>

  <!-- seat post and saddle -->
  <line x1="318" y1="318" x2="305" y2="299" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
  <path d="M 282 297 Q 294 290 308 292 L 342 297 Q 352 299 348 305 Q 344 310 333 309 L 295 308 Q 281 307 282 297 Z" fill="#1f2937"/>

  <!-- stem, handlebar, grip -->
  <line x1="518" y1="296" x2="545" y2="267" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <line x1="537" y1="264" x2="588" y2="259" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="550" y1="263" x2="590" y2="259" stroke="#111827" stroke-width="11" stroke-linecap="round"/>

  <!-- chain and rear cog -->
  <line x1="364" y1="472" x2="216" y2="476" stroke="#6b7280" stroke-width="4"/>
  <line x1="364" y1="512" x2="216" y2="494" stroke="#6b7280" stroke-width="4"/>
  <circle cx="215" cy="485" r="9" fill="none" stroke="#6b7280" stroke-width="4"/>

  <!-- chainring, cranks, pedals (crank vertical: one pedal up, one pedal down) -->
  <circle cx="365" cy="492" r="20" fill="#e5e7eb" stroke="#374151" stroke-width="5"/>
  <line x1="365" y1="492" x2="362" y2="532" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <rect x="349" y="529" width="26" height="7" rx="2" fill="#374151"/>
  <line x1="365" y1="492" x2="366" y2="450" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
  <rect x="353" y="446" width="26" height="7" rx="2" fill="#111827"/>
  <circle cx="365" cy="492" r="5" fill="#374151"/>

  <!-- left arm (far side, drawn behind torso) -->
  <path d="M 464 198 L 503 238" stroke="#93c5fd" stroke-width="15" stroke-linecap="round"/>
  <path d="M 503 238 L 556 262" stroke="#d9b48c" stroke-width="11" stroke-linecap="round"/>
  <circle cx="556" cy="262" r="8" fill="#d9b48c"/>

  <!-- left leg (far side) with foot on the LOWER pedal -->
  <path d="M 312 292 L 364 401" stroke="#6b7280" stroke-width="19" stroke-linecap="round"/>
  <path d="M 364 401 L 356 515" stroke="#d9b48c" stroke-width="13" stroke-linecap="round"/>
  <path d="M 349 515 L 349 529 L 390 529 Q 394 529 393 523 L 391 520 Q 376 514 360 513 L 353 512 Q 349 512 349 515 Z" fill="#1d4ed8"/>
  <text x="365" y="525" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">L</text>

  <!-- right leg (near side) with foot on the UPPER pedal -->
  <path d="M 324 298 L 429 345" stroke="#1f2937" stroke-width="20" stroke-linecap="round"/>
  <path d="M 429 345 L 356 432" stroke="#f0c8a0" stroke-width="14" stroke-linecap="round"/>
  <path d="M 349 434 L 349 446 L 392 446 Q 396 446 395 440 L 393 437 Q 378 431 362 430 L 353 429 Q 349 429 349 434 Z" fill="#b91c1c"/>
  <text x="367" y="442" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">R</text>

  <!-- torso -->
  <path d="M 318 296 L 470 205" stroke="#2563eb" stroke-width="38" stroke-linecap="round"/>

  <!-- neck, head, helmet -->
  <path d="M 478 200 L 497 175" stroke="#f0c8a0" stroke-width="13" stroke-linecap="round"/>
  <circle cx="508" cy="154" r="24" fill="#f0c8a0"/>
  <circle cx="517" cy="150" r="2.6" fill="#1f2937"/>
  <path d="M 482 152 A 27 27 0 0 1 534 146 L 536 153 Q 509 163 484 160 Z" fill="#f59e0b"/>
  <line x1="497" y1="137" x2="500" y2="148" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <line x1="512" y1="135" x2="514" y2="147" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <!-- right arm (near side) -->
  <path d="M 470 205 L 512 248" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
  <path d="M 512 248 L 577 260" stroke="#f0c8a0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="577" cy="260" r="8.5" fill="#f0c8a0"/>
</svg>
