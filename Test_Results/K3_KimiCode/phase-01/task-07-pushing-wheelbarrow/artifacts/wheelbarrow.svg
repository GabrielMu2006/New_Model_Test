<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">A person pushing a wheelbarrow</title>
  <desc id="desc">Side view. A person stands behind a wheelbarrow at the handle end, facing it, leaning forward with both arms extended to grip the handles, pushing it toward the right. The wheel leads at the front; the support leg is lifted off the ground and motion lines trail behind.</desc>

  <!-- ground -->
  <line x1="30" y1="362" x2="610" y2="362" stroke="#8a8578" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#9a957f" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="362" x2="116" y2="352"/>
    <line x1="260" y1="362" x2="257" y2="353"/>
    <line x1="520" y1="362" x2="524" y2="353"/>
    <line x1="580" y1="362" x2="577" y2="354"/>
  </g>

  <!-- motion lines trailing behind (movement is to the right) -->
  <g stroke="#b7b0a1" stroke-width="4" stroke-linecap="round">
    <line x1="34" y1="188" x2="66" y2="188"/>
    <line x1="44" y1="238" x2="82" y2="238"/>
    <line x1="30" y1="288" x2="58" y2="288"/>
  </g>

  <!-- ======== WHEELBARROW ======== -->
  <!-- support leg, lifted while being pushed -->
  <line x1="340" y1="298" x2="322" y2="318" stroke="#55606a" stroke-width="6" stroke-linecap="round"/>

  <!-- wheel fork struts -->
  <line x1="444" y1="298" x2="430" y2="335" stroke="#55606a" stroke-width="5" stroke-linecap="round"/>
  <line x1="408" y1="300" x2="430" y2="335" stroke="#55606a" stroke-width="5" stroke-linecap="round"/>

  <!-- wheel at the FRONT (leading edge of travel) -->
  <circle cx="430" cy="335" r="27" fill="none" stroke="#2c2c30" stroke-width="10"/>
  <circle cx="430" cy="335" r="20" fill="#6d6f75"/>
  <g stroke="#43454a" stroke-width="2.5">
    <line x1="430" y1="317" x2="430" y2="353"/>
    <line x1="414" y1="326" x2="446" y2="344"/>
    <line x1="414" y1="344" x2="446" y2="326"/>
  </g>
  <circle cx="430" cy="335" r="6" fill="#c8c9cd" stroke="#55575c" stroke-width="2"/>

  <!-- basin -->
  <polygon points="296,224 486,224 452,300 326,300" fill="#7d93a3" stroke="#4d5f6b" stroke-width="3" stroke-linejoin="round"/>

  <!-- load heaped in the basin -->
  <path d="M306,224 Q322,192 352,196 Q372,180 402,190 Q430,182 448,198 Q466,196 474,224 Z"
        fill="#8a6a48" stroke="#6d5335" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="352" cy="197" r="6" fill="#7a5c3c"/>
  <circle cx="412" cy="191" r="7" fill="#7a5c3c"/>

  <!-- basin rim -->
  <line x1="292" y1="224" x2="490" y2="224" stroke="#5d7180" stroke-width="7" stroke-linecap="round"/>

  <!-- handles extending back to the pusher -->
  <line x1="332" y1="292" x2="218" y2="230" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/>
  <line x1="336" y1="300" x2="230" y2="244" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/>

  <!-- dust kicked up at the wheel -->
  <g fill="#cfc9bc">
    <circle cx="398" cy="352" r="4"/>
    <circle cx="386" cy="358" r="3"/>
    <circle cx="412" cy="346" r="2.5"/>
  </g>

  <!-- ======== PERSON (behind the load, pushing) ======== -->
  <!-- back leg pushing off -->
  <path d="M148,256 L122,310 L99,355" fill="none" stroke="#3a4652" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="99" y1="355" x2="84" y2="360" stroke="#26221e" stroke-width="8" stroke-linecap="round"/>

  <!-- front leg striding forward -->
  <path d="M150,258 L178,304 L196,356" fill="none" stroke="#3a4652" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="196" y1="356" x2="214" y2="360" stroke="#26221e" stroke-width="8" stroke-linecap="round"/>

  <!-- torso leaning into the push -->
  <line x1="150" y1="252" x2="196" y2="168" stroke="#3f6fb5" stroke-width="13" stroke-linecap="round"/>

  <!-- neck and head, facing the wheelbarrow -->
  <line x1="200" y1="156" x2="204" y2="166" stroke="#f0c8a0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="204" cy="140" r="17" fill="#f0c8a0" stroke="#d9ad7c" stroke-width="2"/>
  <path d="M187,133 A17,17 0 0 1 214,124" fill="none" stroke="#4a3521" stroke-width="7" stroke-linecap="round"/>
  <circle cx="211" cy="137" r="1.8" fill="#26221e"/>

  <!-- arms extended FORWARD onto the handles -->
  <path d="M194,172 L204,204 L222,232" fill="none" stroke="#3f6fb5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200,178 L216,210 L234,246" fill="none" stroke="#3f6fb5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hands gripping the handle ends -->
  <circle cx="222" cy="232" r="5.5" fill="#f0c8a0" stroke="#d9ad7c" stroke-width="1.5"/>
  <circle cx="234" cy="246" r="5.5" fill="#f0c8a0" stroke="#d9ad7c" stroke-width="1.5"/>
</svg>
