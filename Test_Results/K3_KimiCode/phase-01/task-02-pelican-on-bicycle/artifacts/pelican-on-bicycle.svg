<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650"
     role="img" aria-labelledby="title desc"
     stroke-linecap="round" stroke-linejoin="round">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A white pelican with a long orange beak and throat pouch pedals a teal bicycle along a path under a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8effc"/>
      <stop offset="1" stop-color="#f7fcff"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a83f"/>
      <stop offset="1" stop-color="#e07f27"/>
    </linearGradient>

    <!-- bicycle wheel, centered at 0,0 -->
    <g id="wheel" fill="none">
      <circle r="85" stroke="#2f3542" stroke-width="14"/>
      <circle r="71" stroke="#9fb0bd" stroke-width="5"/>
      <g stroke="#b9c6d0" stroke-width="2.5">
        <line x1="0" y1="0" x2="72" y2="0"/>
        <line x1="0" y1="0" x2="62" y2="36"/>
        <line x1="0" y1="0" x2="36" y2="62"/>
        <line x1="0" y1="0" x2="0" y2="72"/>
        <line x1="0" y1="0" x2="-36" y2="62"/>
        <line x1="0" y1="0" x2="-62" y2="36"/>
        <line x1="0" y1="0" x2="-72" y2="0"/>
        <line x1="0" y1="0" x2="-62" y2="-36"/>
        <line x1="0" y1="0" x2="-36" y2="-62"/>
        <line x1="0" y1="0" x2="0" y2="-72"/>
        <line x1="0" y1="0" x2="36" y2="-62"/>
        <line x1="0" y1="0" x2="62" y2="-36"/>
      </g>
      <circle r="9" fill="#57606f" stroke="none"/>
    </g>
  </defs>

  <!-- ===== background ===== -->
  <rect width="900" height="650" fill="url(#sky)"/>

  <!-- sun -->
  <g stroke="#f5c04e" stroke-width="5">
    <line x1="826" y1="95" x2="838" y2="95"/>
    <line x1="810" y1="135" x2="818" y2="143"/>
    <line x1="770" y1="151" x2="770" y2="163"/>
    <line x1="730" y1="135" x2="722" y2="143"/>
    <line x1="714" y1="95" x2="702" y2="95"/>
    <line x1="730" y1="55" x2="722" y2="47"/>
    <line x1="770" y1="39" x2="770" y2="27"/>
    <line x1="810" y1="55" x2="818" y2="47"/>
  </g>
  <circle cx="770" cy="95" r="46" fill="#ffd166"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="110" rx="46" ry="20"/>
    <ellipse cx="185" cy="100" rx="30" ry="16"/>
    <ellipse cx="120" cy="102" rx="26" ry="14"/>
    <ellipse cx="430" cy="70" rx="34" ry="14"/>
    <ellipse cx="455" cy="62" rx="22" ry="11"/>
    <ellipse cx="408" cy="63" rx="18" ry="10"/>
  </g>

  <!-- ground -->
  <rect x="0" y="555" width="900" height="95" fill="#e7dfc6"/>
  <line x1="0" y1="555" x2="900" y2="555" stroke="#d3c8a6" stroke-width="3"/>
  <g stroke="#b7ad8b" stroke-width="4">
    <line x1="80" y1="592" x2="80" y2="580"/>
    <line x1="90" y1="592" x2="94" y2="582"/>
    <line x1="70" y1="592" x2="66" y2="583"/>
    <line x1="830" y1="606" x2="830" y2="594"/>
    <line x1="840" y1="606" x2="844" y2="596"/>
    <line x1="820" y1="606" x2="816" y2="597"/>
  </g>

  <!-- shadows -->
  <ellipse cx="270" cy="561" rx="100" ry="10" fill="#d6cbac"/>
  <ellipse cx="640" cy="561" rx="100" ry="10" fill="#d6cbac"/>

  <!-- speed lines -->
  <g stroke="#c3d4de" stroke-width="5">
    <line x1="118" y1="428" x2="162" y2="428"/>
    <line x1="104" y1="470" x2="156" y2="470"/>
    <line x1="122" y1="512" x2="162" y2="512"/>
  </g>

  <!-- ===== bicycle ===== -->
  <use href="#wheel" x="270" y="470"/>
  <use href="#wheel" x="640" y="470"/>

  <!-- chain -->
  <g fill="none" stroke="#8a94a0" stroke-width="3">
    <line x1="428" y1="480" x2="272" y2="461"/>
    <line x1="428" y1="520" x2="272" y2="479"/>
  </g>
  <circle cx="270" cy="470" r="9" fill="none" stroke="#57606f" stroke-width="4"/>
  <circle cx="430" cy="500" r="20" fill="none" stroke="#57606f" stroke-width="5"/>

  <!-- frame -->
  <g fill="none" stroke="#0f7b6c" stroke-width="7">
    <line x1="270" y1="470" x2="430" y2="500"/>
    <line x1="270" y1="470" x2="360" y2="345"/>
    <line x1="430" y1="500" x2="360" y2="345"/>
    <line x1="430" y1="500" x2="604" y2="368"/>
    <line x1="362" y1="343" x2="588" y2="324"/>
  </g>
  <line x1="586" y1="320" x2="610" y2="376" stroke="#0f7b6c" stroke-width="9"/>
  <line x1="608" y1="372" x2="640" y2="470" fill="none" stroke="#0f7b6c" stroke-width="6"/>

  <!-- seat -->
  <line x1="360" y1="345" x2="352" y2="330" stroke="#57606f" stroke-width="6"/>
  <path d="M312 330 Q340 314 382 326 Q390 331 384 337 Q350 342 322 340 Q310 337 312 330 Z"
        fill="#37404a"/>

  <!-- handlebar -->
  <path d="M586 322 L566 282 Q572 258 556 254" fill="none" stroke="#0f7b6c" stroke-width="7"/>
  <line x1="552" y1="253" x2="528" y2="250" stroke="#37404a" stroke-width="11"/>

  <!-- cranks and pedals -->
  <line x1="430" y1="500" x2="392" y2="458" stroke="#7c8794" stroke-width="8"/>
  <rect x="360" y="453" width="34" height="10" rx="4" fill="#57606f"/>
  <line x1="430" y1="500" x2="468" y2="542" stroke="#57606f" stroke-width="8"/>
  <rect x="458" y="540" width="34" height="10" rx="4" fill="#37404a"/>

  <!-- ===== pelican ===== -->
  <!-- rear leg (far side, darker) -->
  <path d="M372 318 L390 322 L402 452 L386 456 Z" fill="#c96a1d"/>
  <path d="M384 448 L432 458 Q434 464 426 465 L418 461 L414 468 L404 463 L398 469 Q386 462 384 448 Z"
        fill="#c96a1d" stroke="#a9520f" stroke-width="2"/>

  <!-- tail -->
  <path d="M296 246 Q244 238 206 262 Q244 262 236 278 Q264 268 262 286 Q284 270 300 268 Z"
        fill="#efe9db" stroke="#d9d3c3" stroke-width="3"/>

  <!-- body -->
  <ellipse cx="368" cy="248" rx="98" ry="74" transform="rotate(-8 368 248)"
           fill="#f8f5ee" stroke="#d9d3c3" stroke-width="3"/>

  <!-- neck -->
  <path d="M428 200 C436 168 442 146 458 126 L502 136 C486 156 480 182 478 210 Q452 222 428 200 Z"
        fill="#f8f5ee" stroke="#d9d3c3" stroke-width="3"/>

  <!-- head -->
  <path d="M452 92 Q440 78 452 66 Q452 80 462 88 Z" fill="#f8f5ee" stroke="#d9d3c3" stroke-width="3"/>
  <circle cx="478" cy="108" r="30" fill="#f8f5ee" stroke="#d9d3c3" stroke-width="3"/>

  <!-- pouch -->
  <path d="M504 120 Q580 134 648 154 Q640 192 586 200 Q524 198 508 156 Q502 138 504 120 Z"
        fill="#f3bd8d" stroke="#dd9a5f" stroke-width="2.5"/>

  <!-- upper beak -->
  <path d="M500 92 Q578 102 656 142 Q662 148 655 152 Q580 126 502 116 Q496 104 500 92 Z"
        fill="url(#beakGrad)" stroke="#c96a1d" stroke-width="2"/>
  <path d="M652 140 Q664 146 656 156 Q650 152 650 146 Z" fill="#b85f1a"/>

  <!-- eye -->
  <circle cx="486" cy="100" r="4.5" fill="#23262b"/>
  <circle cx="487.5" cy="98.5" r="1.5" fill="#ffffff"/>

  <!-- wing, tip resting on the handlebar grip -->
  <path d="M420 196 Q480 210 524 242 Q538 250 528 258 Q500 262 470 296 Q420 322 366 314 Q322 304 314 274 Q318 240 358 216 Q390 200 420 196 Z"
        fill="#efe9db" stroke="#d9d3c3" stroke-width="3"/>
  <g fill="none" stroke="#d9d3c3" stroke-width="2.5">
    <path d="M350 250 Q400 262 448 252"/>
    <path d="M340 278 Q400 292 452 274"/>
    <line x1="510" y1="246" x2="524" y2="254"/>
    <line x1="498" y1="252" x2="510" y2="260"/>
  </g>

  <!-- front leg and webbed foot on the pedal -->
  <path d="M412 316 L434 320 L466 528 L446 532 Z" fill="#e07f27"/>
  <path d="M446 526 L502 538 Q504 544 496 546 L488 542 L484 550 L474 545 L468 552 L456 544 Q446 538 446 526 Z"
        fill="#e07f27" stroke="#c96a1d" stroke-width="2"/>
</svg>
