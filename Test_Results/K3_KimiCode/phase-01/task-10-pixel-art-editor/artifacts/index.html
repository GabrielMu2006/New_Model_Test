<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group">
      <button id="tool-pencil" class="tool active" title="Pencil (B)">Pencil</button>
      <button id="tool-eraser" class="tool" title="Eraser (E)">Eraser</button>
    </div>

    <div class="group">
      <label class="color-label" title="Pick a color">
        <input type="color" id="color-input" value="#1a1c2c">
      </label>
      <div id="palette"></div>
    </div>

    <div class="group">
      <label for="brush-size">Brush</label>
      <input type="range" id="brush-size" min="1" max="8" value="1">
      <span id="brush-size-label">1</span>
    </div>

    <div class="group">
      <button id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    </div>

    <div class="group">
      <button id="zoom-out" title="Zoom out (-)">&minus;</button>
      <span id="zoom-label">16&times;</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
    </div>

    <div class="group">
      <select id="canvas-size" title="Canvas size">
        <option value="16">16&times;16</option>
        <option value="24">24&times;24</option>
        <option value="32" selected>32&times;32</option>
        <option value="48">48&times;48</option>
        <option value="64">64&times;64</option>
      </select>
      <button id="new-canvas" title="Start a new canvas">New</button>
      <button id="clear" title="Clear the canvas">Clear</button>
    </div>

    <div class="group">
      <button id="export" class="primary" title="Export as PNG">Export PNG</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
  </main>

  <footer id="status">
    <span id="status-info">32&times;32 &middot; 16&times; zoom</span>
    <span id="status-hint">B pencil &middot; E eraser &middot; [ ] brush &middot; +/- zoom &middot; Ctrl+Z / Ctrl+Shift+Z &middot; Ctrl+scroll to zoom &middot; right-click erases</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
